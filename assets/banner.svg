<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
  <defs>
    <style>text { font-family: 'Courier New', 'SF Mono', 'Menlo', 'Consolas', monospace; }</style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d4af55" stroke-width="0.3" opacity="0.07"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181614" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#181614"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#vignette)"/>

  <!-- Top gold line -->
  <rect x="0" y="0" width="1200" height="3" fill="#d4af55" opacity="0.8"/>

  <!-- Left gold bar -->
  <rect x="60" y="100" width="4" height="160" fill="#d4af55" opacity="0.9"/>

  <!-- Microphone icon (simplified) -->
  <g transform="translate(980, 120)" opacity="0.15">
    <rect x="20" y="0" width="40" height="80" rx="20" fill="#d4af55"/>
    <rect x="32" y="70" width="16" height="40" fill="#d4af55"/>
    <path d="M 10 40 Q 10 100 40 100 Q 70 100 70 40" fill="none" stroke="#d4af55" stroke-width="6"/>
    <rect x="20" y="105" width="40" height="10" rx="5" fill="#d4af55"/>
  </g>

  <!-- Sound wave lines -->
  <g transform="translate(1060, 130)" opacity="0.08">
    <rect x="0" y="20" width="3" height="40" rx="1.5" fill="#d4af55"/>
    <rect x="12" y="10" width="3" height="60" rx="1.5" fill="#d4af55"/>
    <rect x="24" y="0" width="3" height="80" rx="1.5" fill="#d4af55"/>
    <rect x="36" y="15" width="3" height="50" rx="1.5" fill="#d4af55"/>
    <rect x="48" y="25" width="3" height="30" rx="1.5" fill="#d4af55"/>
  </g>

  <!-- Title -->
  <text x="80" y="158" font-size="52" font-weight="bold" fill="#d4af55" letter-spacing="2" filter="url(#glow)">WhisperPen</text>

  <!-- Subtitle -->
  <text x="80" y="195" font-size="18" fill="#f5f0e8" opacity="0.8">Local voice-to-text for Windows</text>

  <!-- Tags -->
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="120" height="26" rx="4" fill="#d4af55" opacity="0.12"/>
    <text x="60" y="17" font-size="12" fill="#d4af55" text-anchor="middle">faster-whisper</text>

    <rect x="132" y="0" width="90" height="26" rx="4" fill="#d4af55" opacity="0.12"/>
    <text x="177" y="17" font-size="12" fill="#d4af55" text-anchor="middle">NVIDIA GPU</text>

    <rect x="234" y="0" width="60" height="26" rx="4" fill="#529e94" opacity="0.12"/>
    <text x="264" y="17" font-size="12" fill="#529e94" text-anchor="middle">local</text>

    <rect x="306" y="0" width="110" height="26" rx="4" fill="#529e94" opacity="0.12"/>
    <text x="361" y="17" font-size="12" fill="#529e94" text-anchor="middle">CJK-friendly</text>

    <rect x="428" y="0" width="72" height="26" rx="4" fill="#504840" opacity="0.2"/>
    <text x="464" y="17" font-size="12" fill="#504840" text-anchor="middle">Ollama</text>
  </g>

  <!-- Description -->
  <text x="80" y="295" font-size="14" fill="#504840">Press a hotkey, speak, and your words become text. No cloud, no API keys, just your GPU.</text>

  <!-- Author -->
  <text x="80" y="330" font-size="11" fill="#504840" opacity="0.6">penchan.co/penna</text>

  <!-- Bottom accent -->
  <rect x="0" y="357" width="1200" height="3" fill="#d4af55" opacity="0.3"/>
</svg>
