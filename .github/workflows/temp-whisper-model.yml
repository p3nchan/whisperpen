name: Temporary Whisper Model Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-whisper-model.yml'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5_1 model
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true'
          test -s ggml-base-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-base-q5_1
          path: ggml-base-q5_1.bin
          retention-days: 1
          compression-level: 0
