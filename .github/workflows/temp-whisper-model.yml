name: Temporary Whisper Model Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-whisper-model.yml'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Silero VAD model
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-silero-v6.2.0.bin \
            'https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/models/for-tests-silero-v6.2.0-ggml.bin'
          test -s ggml-silero-v6.2.0.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-silero-v6.2.0
          path: ggml-silero-v6.2.0.bin
          retention-days: 1
          compression-level: 0
