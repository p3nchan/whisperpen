name: Temporary Speaker Model Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-whisper-model.yml'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download speaker embedding model
        run: |
          python -m pip install -q 'huggingface_hub[cli]'
          hf download speechbrain/spkrec-ecapa-voxceleb --local-dir spkrec-ecapa-voxceleb
      - name: Upload speaker model artifact
        uses: actions/upload-artifact@v4
        with:
          name: spkrec-ecapa-voxceleb
          path: spkrec-ecapa-voxceleb
          retention-days: 1
          compression-level: 0
