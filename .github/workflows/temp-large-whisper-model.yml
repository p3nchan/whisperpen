name: Temporary Full Small Whisper Model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-large-whisper-model.yml'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download full small multilingual model
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-small.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true'
          test -s ggml-small.bin
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-full
          path: ggml-small.bin
          retention-days: 1
          compression-level: 0
