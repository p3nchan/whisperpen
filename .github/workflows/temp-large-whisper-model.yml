name: Temporary Full Small Whisper Model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-large-whisper-model.yml'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split full small multilingual model
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-small.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true'
          test -s ggml-small.bin
          split -b 165M -d -a 2 ggml-small.bin small.part.
          ls -lh small.part.*
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: small-full-part-00
          path: small.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: small-full-part-01
          path: small.part.01
          retention-days: 1
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: small-full-part-02
          path: small.part.02
          retention-days: 1
          compression-level: 0
